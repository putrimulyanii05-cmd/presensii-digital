<style>
/* ============ RESET & VARIABEL ============ */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --pink: #ec4899;
  --magenta: #d946ef;
  --violet: #8b5cf6;
  --indigo: #6366f1;
  --cyan: #06b6d4;
  --aqua: #22d3ee;
  --orange: #fb923c;
  --amber: #f59e0b;
  --lime: #84cc16;
  --green: #10b981;
  --red: #f43f5e;

  --text: #1a1035;
  --text-muted: #7c6f99;
  --card: rgba(255,255,255,0.7);
  --border: rgba(236,72,153,0.15);
  --shadow-sm: 0 4px 14px rgba(139,92,246,0.12);
  --shadow-md: 0 10px 32px rgba(236,72,153,0.18);
  --shadow-lg: 0 20px 60px rgba(139,92,246,0.25);

  --grad-primary: linear-gradient(135deg, #ec4899 0%, #8b5cf6 50%, #06b6d4 100%);
  --grad-warm: linear-gradient(135deg, #fb923c 0%, #ec4899 100%);
  --grad-cool: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
  --grad-aurora: linear-gradient(135deg, #f472b6, #c084fc, #22d3ee, #4ade80);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 20%, #ede9fe 45%, #dbeafe 70%, #cffafe 100%);
  background-size: 400% 400%;
  animation: gradientShift 20s ease infinite;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 18px;
  color: var(--text);
  position: relative;
  overflow-x: hidden;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ============ FLOATING SHAPES ============ */
.shape {
  position: fixed;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.55;
  z-index: 0;
  pointer-events: none;
  animation: shapeFloat 16s ease-in-out infinite;
}
.shape-1 {
  width: 340px; height: 340px;
  background: radial-gradient(circle, #f472b6, #ec4899);
  top: -120px; left: -120px;
}
.shape-2 {
  width: 400px; height: 400px;
  background: radial-gradient(circle, #22d3ee, #06b6d4);
  bottom: -160px; right: -160px;
  animation-delay: -4s;
}
.shape-3 {
  width: 260px; height: 260px;
  background: radial-gradient(circle, #c084fc, #8b5cf6);
  top: 35%; right: -100px;
  animation-delay: -8s;
}
.shape-4 {
  width: 220px; height: 220px;
  background: radial-gradient(circle, #fdba74, #fb923c);
  bottom: 20%; left: -100px;
  animation-delay: -12s;
}
@keyframes shapeFloat {
  0%,100% { transform: translate(0,0) scale(1) rotate(0deg); }
  50% { transform: translate(40px,-40px) scale(1.15) rotate(20deg); }
}

/* ============ CONTAINER ============ */
.app {
  max-width: 460px;
  width: 100%;
  position: relative;
  z-index: 1;
  animation: appIn 0.7s cubic-bezier(0.16,1,0.3,1);
}
@keyframes appIn {
  from { opacity: 0; transform: translateY(24px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* ============ HEADER ============ */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  padding: 0 4px;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 48px; height: 48px;
  background: var(--grad-primary);
  background-size: 200% 200%;
  animation: logoGrad 4s ease infinite;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 20px;
  box-shadow: 0 10px 28px rgba(236,72,153,0.4);
  position: relative;
}
@keyframes logoGrad {
  0%,100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.logo::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 20px;
  background: var(--grad-primary);
  background-size: 200% 200%;
  opacity: 0.4;
  z-index: -1;
  filter: blur(8px);
  animation: logoPulse 2.5s ease-in-out infinite;
}
@keyframes logoPulse {
  0%,100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.15); opacity: 0.1; }
}
.header-title {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.4px;
  background: var(--grad-primary);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: logoGrad 4s ease infinite;
}
.header-sub { font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
.header-right { display: flex; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.9);
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(12px);
  color: var(--pink);
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.25s;
  box-shadow: var(--shadow-sm);
}
.icon-btn:hover {
  transform: translateY(-2px) rotate(-6deg);
  box-shadow: var(--shadow-md);
  color: var(--violet);
  background: white;
}

/* ============ STATS ============ */
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}
.stat-card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 14px 8px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: var(--shadow-sm);
  transition: transform 0.3s, box-shadow 0.3s;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: var(--grad-primary);
  border-radius: 3px 3px 0 0;
}
.stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.stat-total::before { background: var(--grad-cool); }
.stat-total .stat-value {
  background: var(--grad-cool);
  background-size: 200% auto;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-hadir::before { background: linear-gradient(135deg, #4ade80, #10b981); }
.stat-hadir .stat-value {
  background: linear-gradient(135deg, #4ade80, #059669);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-belum::before { background: linear-gradient(135deg, #fdba74, #fb923c); }
.stat-belum .stat-value {
  background: linear-gradient(135deg, #fb923c, #ef4444);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-value { font-size: 24px; font-weight: 900; line-height: 1; letter-spacing: -1px; }
.stat-label {
  font-size: 9px;
  font-weight: 800;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 5px;
}

/* ============ PROGRESS RING ============ */
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(16px);
  border-radius: 16px;
  padding: 14px 18px;
  margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}
.progress-wrap::before {
  content: '';
  position: absolute;
  top: -50%; right: -20%;
  width: 120px; height: 120px;
  background: radial-gradient(circle, rgba(236,72,153,0.15), transparent);
  border-radius: 50%;
  pointer-events: none;
}
.progress-ring { position: relative; width: 64px; height: 64px; flex-shrink: 0; }
.progress-ring svg { transform: rotate(-90deg); width: 64px; height: 64px; }
.progress-ring .bg { fill: none; stroke: rgba(139,92,246,0.12); stroke-width: 6; }
.progress-ring .fg {
  fill: none;
  stroke: url(#gradAurora);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 175.9;
  stroke-dashoffset: 175.9;
  transition: stroke-dashoffset 1.2s cubic-bezier(0.16,1,0.3,1);
  filter: drop-shadow(0 0 6px rgba(236,72,153,0.5));
}
.progress-ring .pct {
  position: absolute;
  inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 900;
  background: var(--grad-primary);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.progress-info { flex: 1; }
.progress-title { font-size: 13px; font-weight: 800; color: var(--text); }
.progress-desc { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

/* ============ CARD UMUM ============ */
.card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 14px;
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.3s, transform 0.3s;
  position: relative;
}
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card-title {
  font-size: 14px;
  font-weight: 800;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  letter-spacing: -0.3px;
  color: var(--text);
}
.card-title i {
  width: 26px; height: 26px;
  display: flex; align-items: center; justify-content: center;
  background: var(--grad-primary);
  background-size: 200% auto;
  animation: logoGrad 4s ease infinite;
  color: white;
  font-size: 12px;
  border-radius: 8px;
  box-shadow: 0 3px 10px rgba(236,72,153,0.3);
}
.card-title .badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 800;
  padding: 4px 12px;
  border-radius: 20px;
  background: linear-gradient(135deg, rgba(236,72,153,0.15), rgba(139,92,246,0.15));
  color: var(--pink);
  border: 1px solid rgba(236,72,153,0.2);
}

/* ============ QR WRAPPER ============ */
.qr-wrap { text-align: center; position: relative; }
.qr-frame {
  display: inline-block;
  padding: 14px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 12px 40px rgba(236,72,153,0.2);
  position: relative;
  transition: transform 0.3s;
}
.qr-frame:hover { transform: scale(1.03) rotate(-1deg); }
.qr-frame::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 26px;
  background: linear-gradient(135deg, #ec4899, #8b5cf6, #06b6d4, #4ade80, #ec4899);
  background-size: 300% 300%;
  z-index: -1;
  opacity: 0.6;
  filter: blur(10px);
  animation: qrGlow 6s linear infinite;
}
@keyframes qrGlow {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}
#qrImage canvas, #qrImage img { display: block; border-radius: 10px; }
.qr-caption {
  margin-top: 12px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.qr-caption i { color: #10b981; }

/* ============ ACTION ROW ============ */
.action-row { display: flex; gap: 10px; margin-bottom: 14px; }
.btn {
  flex: 1;
  padding: 12px 14px;
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 800;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  position: relative;
  overflow: hidden;
  text-decoration: none;
  letter-spacing: 0.2px;
}
.btn::after {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 0; height: 0;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
  transform: translate(-50%,-50%);
  transition: width 0.5s, height 0.5s;
}
.btn:active::after { width: 300px; height: 300px; }
.btn-primary {
  background: var(--grad-primary);
  background-size: 200% auto;
  color: white;
  box-shadow: 0 6px 20px rgba(236,72,153,0.35);
  animation: logoGrad 4s ease infinite;
}
.btn-primary:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 10px 28px rgba(236,72,153,0.5);
}
.btn-soft {
  background: rgba(255,255,255,0.85);
  color: var(--pink);
  border: 1.5px solid rgba(236,72,153,0.2);
}
.btn-soft:hover {
  background: white;
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(236,72,153,0.15);
  border-color: var(--pink);
}
.btn-cyan {
  background: var(--grad-cool);
  background-size: 200% auto;
  color: white;
  box-shadow: 0 6px 20px rgba(6,182,212,0.35);
}
.btn-cyan:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 10px 28px rgba(6,182,212,0.5);
}

/* ============ INPUT GROUP ============ */
.input-group { display: flex; gap: 10px; }
.input-group input {
  flex: 1;
  padding: 13px 18px;
  border: 1.5px solid rgba(236,72,153,0.15);
  border-radius: 14px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  background: rgba(255,255,255,0.85);
  color: var(--text);
  transition: all 0.3s;
}
.input-group input:focus {
  outline: none;
  border-color: var(--pink);
  box-shadow: 0 0 0 4px rgba(236,72,153,0.12);
  background: white;
  transform: translateY(-1px);
}
.input-group input::placeholder { color: #a99bb5; font-weight: 500; }
.input-group button {
  padding: 13px 22px;
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  background: var(--grad-primary);
  background-size: 200% auto;
  color: white;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.3s;
  box-shadow: 0 6px 20px rgba(236,72,153,0.3);
  white-space: nowrap;
  animation: logoGrad 4s ease infinite;
}
.input-group button:hover {
  transform: translateY(-3px) scale(1.02);
  box-shadow: 0 10px 28px rgba(236,72,153,0.45);
}

/* ============ QR PREVIEW ============ */
.qr-preview {
  margin-top: 14px;
  padding: 18px;
  background: linear-gradient(135deg, rgba(236,72,153,0.06), rgba(139,92,246,0.06), rgba(6,182,212,0.06));
  border-radius: 16px;
  border: 2px dashed rgba(236,72,153,0.3);
  text-align: center;
  display: none;
}
.qr-preview.show { display: block; animation: previewIn 0.4s cubic-bezier(0.16,1,0.3,1); }
@keyframes previewIn {
  from { opacity: 0; transform: translateY(-10px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.qr-preview .preview-actions {
  margin-top: 12px;
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}
.qr-preview .preview-actions button {
  padding: 9px 16px;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-weight: 800;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.25s;
}
.btn-dl {
  background: var(--grad-primary);
  background-size: 200% auto;
  color: white;
  box-shadow: 0 4px 12px rgba(236,72,153,0.3);
}
.btn-dl:hover { transform: translateY(-2px); }
.btn-wa-sm {
  background: linear-gradient(135deg, #25d366, #128c7e);
  color: white;
  box-shadow: 0 4px 12px rgba(37,211,102,0.3);
}
.btn-wa-sm:hover { transform: translateY(-2px); }
.btn-close-sm {
  background: rgba(0,0,0,0.06);
  color: var(--text);
}
.btn-close-sm:hover { background: rgba(0,0,0,0.12); }

/* ============ SCANNER ============ */
.scanner-wrap {
  position: relative;
  border-radius: 18px;
  overflow: hidden;
  background: #0f0a1f;
  min-height: 280px;
  margin-bottom: 12px;
  box-shadow: inset 0 0 40px rgba(236,72,153,0.15);
}
#qr-reader { width: 100% !important; min-height: 280px; }
#qr-reader video { width: 100% !important; height: auto !important; display: block !important; }
#qr-reader > div:not(:first-child) { display: none !important; }
#qr-reader > div:first-child { width: 100% !important; height: auto !important; }

.scan-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}
.scan-box {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 62%; height: 42%;
  border-radius: 18px;
  box-shadow: 0 0 0 4000px rgba(15,10,31,0.65);
}
.scan-box .c {
  position: absolute;
  width: 28px; height: 28px;
  border-style: solid;
  border-width: 0;
}
.c-tl {
  top:-2px; left:-2px;
  border-top-width:4px; border-left-width:4px;
  border-top-color: #ec4899;
  border-left-color: #ec4899;
  border-radius:10px 0 0 0;
  filter: drop-shadow(0 0 10px #ec4899);
}
.c-tr {
  top:-2px; right:-2px;
  border-top-width:4px; border-right-width:4px;
  border-top-color: #8b5cf6;
  border-right-color: #8b5cf6;
  border-radius:0 10px 0 0;
  filter: drop-shadow(0 0 10px #8b5cf6);
}
.c-bl {
  bottom:-2px; left:-2px;
  border-bottom-width:4px; border-left-width:4px;
  border-bottom-color: #06b6d4;
  border-left-color: #06b6d4;
  border-radius:0 0 0 10px;
  filter: drop-shadow(0 0 10px #06b6d4);
}
.c-br {
  bottom:-2px; right:-2px;
  border-bottom-width:4px; border-right-width:4px;
  border-bottom-color: #4ade80;
  border-right-color: #4ade80;
  border-radius:0 0 10px 0;
  filter: drop-shadow(0 0 10px #4ade80);
}
.scan-laser {
  position: absolute;
  left: 12%; right: 12%;
  height: 3px;
  background: linear-gradient(90deg, transparent, #ec4899, #8b5cf6, #06b6d4, #4ade80, transparent);
  background-size: 200% 100%;
  border-radius: 3px;
  box-shadow: 0 0 20px rgba(236,72,153,0.8), 0 0 40px rgba(6,182,212,0.4);
  animation: laserMove 2.5s ease-in-out infinite, laserColor 3s linear infinite;
}
@keyframes laserMove {
  0% { top: 28%; opacity: 0.5; }
  50% { top: 72%; opacity: 1; }
  100% { top: 28%; opacity: 0.5; }
}
@keyframes laserColor {
  0% { background-position: 0% 50%; }
  100% { background-position: 200% 50%; }
}
.scan-status {
  position: absolute;
  bottom: 14px; left: 50%;
  transform: translateX(-50%);
  background: rgba(15,10,31,0.8);
  backdrop-filter: blur(12px);
  color: white;
  font-size: 11px;
  font-weight: 700;
  padding: 8px 18px;
  border-radius: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid rgba(236,72,153,0.3);
  white-space: nowrap;
  box-shadow: 0 4px 20px rgba(236,72,153,0.3);
}
.scan-status i {
  color: #ec4899;
  font-size: 12px;
  animation: blink 1.5s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

.scan-controls { display: flex; gap: 10px; }
.scan-controls button {
  flex: 1;
  padding: 13px;
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-weight: 800;
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.3s;
}
.btn-scan-on {
  background: var(--grad-primary);
  background-size: 200% auto;
  color: white;
  box-shadow: 0 6px 22px rgba(236,72,153,0.4);
  animation: logoGrad 4s ease infinite;
}
.btn-scan-on:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(236,72,153,0.55); }
.btn-scan-on.stop {
  background: linear-gradient(135deg, #f43f5e, #dc2626);
  box-shadow: 0 6px 22px rgba(244,63,94,0.4);
  animation: none;
}
.btn-flash-sm {
  background: rgba(255,255,255,0.85);
  color: var(--text);
  border: 1.5px solid rgba(236,72,153,0.15);
  flex: 0.35;
}
.btn-flash-sm:hover { border-color: var(--pink); color: var(--pink); }
.btn-flash-sm.active {
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: white;
  border-color: transparent;
  box-shadow: 0 6px 22px rgba(251,191,36,0.5);
}

/* ============ CONNECTION ============ */
.conn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(255,255,255,0.7);
